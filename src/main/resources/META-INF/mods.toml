modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# Server-side mixin that records accepted gifts (BreedableRelationship.acceptGift) for the
# gratitude/template features.
[[mixins]]
    config="mcaconversations.mixins.json"

# MCA: Conversations is meaningless without MCA Reborn, so MCA is a mandatory dependency.
# We load AFTER MCA so its entities, dialogue registries, and resource loaders are present.
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mca"
    mandatory=true
    versionRange="[7.6,8)"
    ordering="AFTER"
    side="BOTH"
# NOTE: Architectury is deliberately NOT declared here. MCA 7.6 requires it and declares that
# itself; MCA 7.7 dropped the dependency entirely. Conversations has zero Architectury references,
# so declaring it mandatory only broke upgrades — a 7.7 user who removed Architectury (as 7.7
# allows) was blocked by *this* mod with "requires architectury ... not installed".
# MCA: Quests is an OPTIONAL integration. Conversations loads and works fully without it; when present we
# load AFTER it so its objective/reward registries and dialogue-hook API exist before our setup runs.
# The integration needs the Quests build that ships the api.QuestDialogueHooks / ExternalSignalObjective
# seams; an older Quests without them degrades gracefully (QuestsBridge catches the missing API and
# disables the integration), so the range stays permissive.
[[dependencies.${mod_id}]]
    modId="mcaquests"
    mandatory=false
    versionRange="[0.8,)"
    ordering="AFTER"
    side="BOTH"

# MCA: Reputation is an OPTIONAL integration. Conversations loads and plays fully without it: the
# reputation dialogue conditions score 0, the public-standing check term is exactly 0 (so every
# existing seeded outcome is unchanged), the reputation signal action is a no-op, and no external
# gossip candidate is offered. When present we load AFTER it so its API and registries exist before
# ReputationBridge tries to install the integration (spec 9.3).
[[dependencies.${mod_id}]]
    modId="mcareputation"
    mandatory=false
    versionRange="[0.2,)"
    ordering="AFTER"
    side="BOTH"
