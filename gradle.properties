# Memory for the Minecraft decompile/setup. Daemon off to avoid stale-JDK daemons.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# Force Gradle + the toolchain onto JDK 17 (system default here is JDK 21, which
# ForgeGradle 6 does not tolerate). Change if your JDK 17 lives elsewhere.
# org.gradle.java.home intentionally unset: rely on JAVA_HOME / the foojay toolchain
# resolver so the build works on any machine (the previous absolute Linux path did not).

## Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Dependencies
# MCA Reborn for 1.20.1 Forge, via Modrinth Maven (accepts the version string directly).
# RUNTIME ONLY. Nothing in src/main/java references an MCA type: every MCA class and member is
# resolved by name at runtime by compat.mca.McaBinding, so one jar works across MCA's package-root
# migrations. This version is only what dev runClient/runServer launches with.
# 7.7.0-beta.2 is the first 7.7 build that starts at all — 7.7.0-beta.1 ships a truncated
# forge-mca.refmap.json and dies applying its own MixinLivingEntity, with or without this mod.
# The compiled binary still runs on MCA 7.6 (see mods.toml range); every consumed signature is
# identical across 7.6.20/7.7.x, and the one drift (Personality enum -> registry class) is
# handled through Personality.toString() in McaCompat.
mca_version=7.7.0-beta.2+1.20.1
# Every MCA build McaBindingProbeTest replays the manifest against, comma-separated, each in its own
# class loader. One entry per known package root, because the root cannot be inferred from the version
# number: 7.6.20 and 7.7.0-beta.2 are forge.net.mca, 7.7.1-alpha.2 is forge.net.conczin.mca. Add a
# version here whenever MCA moves again, so the build catches the move instead of a player's log.
mca_probe_versions=7.6.20+1.20.1,7.7.0-beta.2+1.20.1,7.7.1-alpha.2+1.20.1
# Architectury API (Forge) — required by MCA 7.6 only (7.7 dropped it). Kept for the dev runtime
# so a 7.6 dev run still resolves; Conversations itself never references Architectury.
architectury_version=9.2.14

## Mod metadata
mod_id=mcaconversations
mod_name=MCA: Conversations
