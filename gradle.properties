mod_license=GPL-3.0-only
mod_version=1.4.0
mod_group_id=dev.otectus.mcaconversations
mod_authors=otectus
mod_description=Deeper, less repetitive villager conversations for Minecraft Comes Alive: Reborn — heart-gated personal topics, conversation memory, gratitude, personalized lines, and village gossip.
