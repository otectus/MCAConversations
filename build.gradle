plugins {
    id 'idea'
    id 'eclipse'
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

// Loader and game version both live in the artifact name and the mod version, so a 1.21.1
// NeoForge build can never be mistaken for -- or overwrite -- the 1.20.1 Forge one.
version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge"
}

// Minecraft 1.20.5+ requires Java 21. The foojay resolver provisions it if the system JDK is older.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // The content lint, locale parity and NBT round-trip tests need real Minecraft classes on
    // the test classpath.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    // MCA Reborn. The loader is in the artifact id (mca-neoforge), so there is no
    // Fabric/NeoForge ambiguity here. Scoped so nothing else resolves through it.
    maven {
        name = 'Conczin'
        url = 'https://maven.conczin.net/Artifacts'
        content { includeGroup 'net.conczin.mca' }
    }
}

// Every MCA build McaBindingProbeTest verifies the manifest against, one configuration each. Two
// versions of the same module cannot share a configuration -- Gradle's conflict resolution would
// collapse them to the newer and the older binary would go untested, which is the whole point of
// probing more than one. Each is opened in its own class loader.
ext.mcaProbeVersions = (project.findProperty('mcaProbeVersions') ?: mca_probe_versions)
        .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }

// MCA deliberately stays on testRuntimeClasspath. ModDevGradle's unitTest boots FML in the test JVM,
// and FML enforces neoforge.mods.toml's mandatory `mca` dependency -- excluding the jar makes every
// test fail at bootstrap. SOURCE's ForgeGradle tests never booted FML, which is why SOURCE could
// exclude it. McaBindingProbeTest keeps its isolation via a filtering parent classloader instead.

mcaProbeVersions.eachWithIndex { version, i ->
    configurations.create("mcaProbe${i}") {
        canBeConsumed = false
        // Just the MCA jar: the probe opens it against the test classloader, which already carries
        // Minecraft, and pulling MCA's own dependency graph in (sodium, ferrite-core from the
        // Modrinth Maven) would not resolve anyway.
        transitive = false
    }
}

// The sibling add-on APIs are vendored as compile-only jars in libs/api/ and pinned by
// gradle/sibling-apis.properties: version, provider commit and SHA-256 for each. Compiling against a
// checked-in artifact rather than a sibling checkout's class output is what makes a clean clone -- or
// CI, which has no siblings at all -- produce the same optional integrations the release did, and
// verifySiblingApis refuses the build the moment a jar is swapped underneath it.
ext.siblingApis = new Properties()
file('gradle/sibling-apis.properties').withInputStream { ext.siblingApis.load(it) }

// Resolves one provider's API artifact. -PmcaQuestsApiPath / -PmcaReputationApiPath replace the
// vendored jar with a jar or a class directory, for iterating against a provider working tree; an
// override is announced and skips the hash check. Absence is never a warning: an unbuildable optional
// integration is a broken build, not a quieter jar.
ext.siblingApi = { String key, String overrideProperty ->
    def override = project.findProperty(overrideProperty)
    if (override) {
        def overridden = file(override)
        if (!overridden.exists()) {
            throw new GradleException("-P${overrideProperty}=${override} does not exist; " +
                    "point it at a ${key} API jar or class directory, or drop the property to use " +
                    "the vendored ${siblingApis.getProperty("${key}.jar")}.")
        }
        logger.lifecycle("sibling API override in effect: ${key} <- ${overridden} (SHA-256 check skipped)")
        return [file: overridden, pinned: false]
    }
    def relative = siblingApis.getProperty("${key}.jar")
    if (!relative) {
        throw new GradleException("gradle/sibling-apis.properties has no '${key}.jar' key; " +
                "the ${key} API artifact cannot be resolved.")
    }
    def jar = file(relative)
    if (!jar.exists()) {
        throw new GradleException("${key} API jar missing at ${jar} (manifest key '${key}.jar' in " +
                "gradle/sibling-apis.properties). Build the provider and copy " +
                "build/libs/${key}-${siblingApis.getProperty("${key}.version")}-api.jar into libs/api/, " +
                "or point -P${overrideProperty} at a local jar or class directory.")
    }
    return [file: jar, pinned: true]
}
ext.mcaQuestsApi = siblingApi('mcaquests', 'mcaQuestsApiPath')
ext.mcaReputationApi = siblingApi('mcareputation', 'mcaReputationApiPath')

dependencies {
    // MCA Reborn — a mojmap NeoForge mod jar, so it loads as a real mod under runClient/runServer.
    // (On 1.20.1 it could not: MCA's Forge mixins shipped SRG-named with no refmap.)
    //
    // runtimeOnly, NOT implementation: no class in src/main/java names an MCA type any more, because
    // compat.mca.McaBinding resolves every MCA class and member by name at runtime and the mixins
    // declare their targets as strings. A compile dependency would only invite the static linkage
    // back -- NoMcaStaticLinkTest fails the build if it ever returns.
    //
    // transitive = false on purpose: MCA's POM declares runtime dependencies on
    // maven.modrinth:sodium and maven.modrinth:ferrite-core, which do not resolve without the
    // Modrinth Maven. MixinExtras is already jarJar'd inside the MCA jar, so nothing needed is lost.
    //
    // All MCA access is isolated behind dev.otectus.mcaconversations.compat and .mixin.
    runtimeOnly("net.conczin.mca:mca-neoforge:${mca_version}") {
        transitive = false
    }

    // The probe fleet McaBindingProbeTest replays the binding manifest against (see
    // ext.mcaProbeVersions). Same group/artifact and Maven as the pinned mca_version above; the
    // loader is in the artifact id, so there is nothing to disambiguate. These are never on any
    // compile or runtime classpath -- the test task hands them over as file paths.
    mcaProbeVersions.eachWithIndex { version, i ->
        add("mcaProbe${i}", "net.conczin.mca:mca-neoforge:${version}")
    }

    // MCA: Quests — OPTIONAL integration, compile-only. Resolved from the vendored, hash-pinned API
    // jar in libs/api/ (see gradle/sibling-apis.properties), not from a sibling checkout: a clean clone
    // and CI then compile the integration exactly as the release did. Both mods use official 1.21.1
    // mappings and there is no reobfuscation step to worry about. Never bundled: the real mod supplies
    // these classes at runtime, gated by QuestsBridge's ModList check and the optional
    // neoforge.mods.toml dependency.
    compileOnly files(mcaQuestsApi.file)

    // MCA: Reputation — OPTIONAL integration, compile-only, same vendored-API pattern as the Quests
    // block above. Every reputation-gated dialogue condition and template variable still falls back to
    // a documented safe default when the mod is absent at runtime; what is gone is the old build-time
    // fallback that dropped the compat sources, which turned a missing sibling into a quietly
    // integration-less jar.
    compileOnly files(mcaReputationApi.file)

    // No Mixin dependency or annotation processor: ModDevGradle wires both through NeoForge, and
    // 1.21.1 needs no refmap (dev and production both run official Mojang names).

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // ModDevGradle's unitTest runner works out of build/minecraft-junit, so the content lints,
    // locale parity and mixin-JSON tests cannot reach src/ through a bare relative path.
    systemProperty 'mcaconversations.projectRoot', project.projectDir.absolutePath

    // The MCA jars travel as paths, not a classpath: McaBindingProbeTest opens each in its own
    // URLClassLoader, so the binding manifest is verified against real MCA without a single MCA
    // class being linked into the test JVM. Resolved in doFirst so the configurations are not
    // resolved while the build is still being configured.
    doFirst {
        systemProperty 'mcaconversations.probe.jars', mcaProbeVersions.indices
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .findAll { it.name.contains('mca-neoforge') }
                .join(File.pathSeparator)
    }
}

// ModDevGradle's unitTest wiring lands on `test` and on no other Test task. It is `test` alone that
// gets the prepare tasks, the build/minecraft-junit working directory, `fml.junit.argsfile`, the
// @argfile on the command line and the mod-folders argument provider. Without them FML's JUnit
// LauncherSessionListener -- which is on the test runtime classpath and boots the game for every
// Test task -- looks for mainargs.txt in the project directory and dies before a single test runs.
//
// So the hand-registered Test tasks below borrow `test`'s fork options at execution time and set
// their own system properties on top: the copy replaces the whole system property map, so theirs
// have to go on after it, not before. `test` is already realized and configured by the `test { }`
// block above, so reading it here costs nothing and runs none of it.
//
// Copied field by field rather than through JavaForkOptions.copyTo: copyTo also assigns the debug
// options, and by the time a Test task's actions run its `debugOptions.enabled` is already final.
ext.inheritUnitTestWiring = { Test task ->
    def wired = tasks.getByName('test')
    task.workingDir = wired.workingDir
    task.jvmArgs = wired.jvmArgs
    task.systemProperties = wired.systemProperties
    task.environment = wired.environment
    task.jvmArgumentProviders.addAll(wired.jvmArgumentProviders)
}

// The prepare tasks `test` depends on for those same arg files.
def unitTestPrepareTasks = ['prepareNeoForgeTestFiles', 'writeNeoForgeTestClasspath', 'downloadAssets']

// Resolves TownsteadBinding's manifest against a real Townstead jar, in its own JVM and its own
// classloader. Separate from `test` because it needs a jar nobody can resolve from a maven: Townstead
// is published on CurseForge only, so the path is supplied by the person running it.
//
//     ./gradlew townsteadProbeTest -PtownsteadModernJar=/path/townstead-0.7.6+1.21.1.jar
//
// Both -PtownsteadModernJar and -PtownsteadLegacyJar are accepted and either may be given alone.
// MCA rides along on `mcaconversations.probe.jars` for a load-bearing reason: Townstead is compiled
// against MCA, so enumerating TownsteadAPI's methods resolves an MCA parameter type, and without MCA
// present the whole class reads as unbound and the probe would pass vacuously. Minecraft itself comes
// from sourceSets.test.runtimeClasspath for the same reason.
//
// Never wired into `build` or `check`: it needs an operator-supplied jar.
tasks.register('townsteadProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the Townstead binding manifest against a supplied Townstead jar.'
    dependsOn unitTestPrepareTasks
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'dev.otectus.mcaconversations.compat.TownsteadBindingProbeTest'
        includeTestsMatching 'dev.otectus.mcaconversations.compat.TownsteadUiMixinProbeTest'
    }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    doFirst {
        inheritUnitTestWiring(it)
        systemProperty 'mcaconversations.townstead.probe.jars',
                ['townsteadModernJar', 'townsteadLegacyJar']
                        .findAll { project.hasProperty(it) }
                        .collect { project.property(it).toString() }
                        .join(File.pathSeparator)
        systemProperty 'mcaconversations.probe.jars', mcaProbeVersions.indices
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .findAll { it.name.contains('mca-neoforge') }
                .join(File.pathSeparator)
    }
}

// Resolves CapitalsBinding's manifest against a real MCA Capitals jar, in its own JVM and its own
// classloader. Separate from `test` for the same reason as townsteadProbeTest: Capitals is published
// on CurseForge and Modrinth only, so the path is supplied by the person running it.
//
//     ./gradlew capitalsProbeTest -PcapitalsJar=/path/mcacapitals-1.3.6.jar
//
// MCA rides along on `mcaconversations.probe.jars` because Capitals is compiled against MCA, and a
// Capitals class whose descriptors name an MCA type reads as unbound with MCA absent -- which is the
// correct production degradation but would make this probe pass vacuously. The 7.7 probe jars are
// used rather than the dev-runtime MCA, because Capitals requires 7.7.1-alpha.2 or newer.
//
// Never wired into `build` or `check`: it needs an operator-supplied jar.
tasks.register('capitalsProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the MCA Capitals binding manifest against a supplied Capitals jar.'
    dependsOn unitTestPrepareTasks
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'dev.otectus.mcaconversations.compat.CapitalsBindingProbeTest'
    }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    doFirst {
        inheritUnitTestWiring(it)
        systemProperty 'mcaconversations.capitals.probe.jar',
                project.hasProperty('capitalsJar') ? project.property('capitalsJar').toString() : ''
        systemProperty 'mcaconversations.probe.jars', mcaProbeVersions.indices
                .findAll { i -> mcaProbeVersions[i].startsWith('7.7') }
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .findAll { it.name.contains('mca-neoforge') }
                .join(File.pathSeparator)
    }
}

// The vendored API jars are the compile-time contract with the sibling add-ons, so they are checked
// byte-for-byte before anything compiles against them. A jar that has been rebuilt, re-copied from the
// wrong loader's build directory or edited in place is a silently wrong build otherwise: it compiles,
// and the mismatch only surfaces as a NoSuchMethodError in someone's world.
tasks.register('verifySiblingApis') {
    group = 'verification'
    description = 'Fails if a vendored sibling API jar does not match its pinned SHA-256.'
    doLast {
        def problems = []
        [[key: 'mcaquests', property: 'mcaQuestsApiPath', api: mcaQuestsApi],
         [key: 'mcareputation', property: 'mcaReputationApiPath', api: mcaReputationApi]].each { provider ->
            if (!provider.api.pinned) {
                logger.lifecycle("verifySiblingApis: ${provider.key} is overridden, hash not checked.")
                return
            }
            def expected = siblingApis.getProperty("${provider.key}.sha256")
            if (!expected) {
                problems << "gradle/sibling-apis.properties has no '${provider.key}.sha256' key"
                return
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            provider.api.file.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            def actual = digest.digest().encodeHex().toString()
            if (!expected.equalsIgnoreCase(actual)) {
                problems << "${provider.api.file} does not match ${provider.key}.sha256:" +
                        System.lineSeparator() + "      expected ${expected}" +
                        System.lineSeparator() + "      actual   ${actual}" +
                        System.lineSeparator() + "      Refresh: rebuild the provider (./gradlew build), copy " +
                        "build/libs/${provider.key}-${siblingApis.getProperty("${provider.key}.version")}-api.jar " +
                        "into libs/api/ and update version, commit and sha256 in " +
                        "gradle/sibling-apis.properties. To compile against a working tree instead, pass " +
                        "-P${provider.property}."
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("verifySiblingApis failed:" + System.lineSeparator()
                    + "  - " + problems.join(System.lineSeparator() + "  - "))
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'verifySiblingApis'
}

// The content compiler: expands src/content/ authoring sources into runtime resources (spec 19).
//
// Deliberately NOT wired into processResources. The compiler lives in the test source set - it is
// build tooling and has no business in the shipped jar - and compileTestJava already depends on
// processResources through `classes`, so making processResources depend on it would be a cycle.
//
// Instead the generated files are committed and ContentCompilerTest verifies them on every
// `./gradlew check`: it compiles src/content into a scratch copy of the output tree and byte-compares
// it back, failing on any file that is stale, missing or left over. That check never writes into the
// repository. Regenerating is this task, and it is an explicit author command:
//
//     ./gradlew generateConversationContent
//
// The check alone, for the edit-compile-look loop:
//
//     ./gradlew verifyGeneratedConversationContent
//
// Nothing in the authoring package imports net.minecraft, but the test runtime classpath still
// carries FML's JUnit launcher, so these two inherit `test`'s wiring like the probe task does. Both
// get the project root injected the way `test` does -- TestPaths resolves src/ through it, and they
// run out of the same build/minecraft-junit working directory.
tasks.register('verifyGeneratedConversationContent', Test) {
    group = 'verification'
    description = 'Fails if the committed generated content is not what src/content compiles to.'
    dependsOn unitTestPrepareTasks
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    doFirst {
        inheritUnitTestWiring(it)
        systemProperty 'mcaconversations.projectRoot', project.projectDir.absolutePath
    }
    filter { includeTestsMatching 'dev.otectus.mcaconversations.authoring.ContentCompilerTest' }
    // Content drift is a property of the working tree, not of the inputs Gradle can see: a hand edit
    // to a generated file changes neither this task's classpath nor its sources.
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

tasks.register('generateConversationContent', JavaExec) {
    group = 'documentation'
    description = 'Compiles src/content authoring sources into runtime data and lang resources.'
    dependsOn tasks.named('compileTestJava'), tasks.named('processTestResources')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.otectus.mcaconversations.authoring.ContentCompiler'
    args 'src/content', 'src/main/resources'
    // The compiler classes are built for 21; without an explicit launcher JavaExec runs on
    // JAVA_HOME (17 on the dev machines) and dies with a LinkageError before doing anything.
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    outputs.upToDateWhen { false }
}

// The personality overlays are six voices, not twenty-one. Each voice is authored once in
// src/content/voices and expanded into every namespace that speaks it, in both locales, by
//
//     ./gradlew generateVoiceOverlays
//
// Before this existed the expansion was done by hand, which is why 999 of every family's 1,084 keys
// are byte-identical and why overlay coverage sat at 5.9%: adding one line cost forty-two edits.
//
tasks.register('verifyVoiceOverlays', Test) {
    group = 'verification'
    description = 'Fails if the committed personality overlays are not what src/content/voices compiles to.'
    dependsOn unitTestPrepareTasks
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    doFirst {
        inheritUnitTestWiring(it)
        systemProperty 'mcaconversations.projectRoot', project.projectDir.absolutePath
    }
    filter { includeTestsMatching 'dev.otectus.mcaconversations.authoring.VoiceFamilyCompilerTest' }
    // Overlay drift is a property of the working tree, not of any input Gradle can see.
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

tasks.register('generateVoiceOverlays', JavaExec) {
    group = 'documentation'
    description = 'Expands the six authored voices into every personality overlay namespace.'
    dependsOn tasks.named('compileTestJava'), tasks.named('processTestResources')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.otectus.mcaconversations.authoring.VoiceFamilyCompiler'
    args 'src/content/voices', 'src/main/resources/assets'
    // Same JDK 21 launcher pin as generateConversationContent, for the same reason.
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    outputs.upToDateWhen { false }
}

// Expand metadata placeholders into neoforge.mods.toml / pack.mcmeta at build time.
tasks.named('processResources', ProcessResources).configure {
    // Without this the expansion is written in the platform charset (windows-1252 here), which
    // cannot encode every character the metadata contains and emits '?' bytes mid-sequence. The
    // result is a neoforge.mods.toml that is not valid UTF-8, and NightConfig rejects the file.
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mca_version: mca_version, mca_version_range: mca_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: project.version.toString(),
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

// Phase 9: the generated review and coverage reports are release artifacts, not build leftovers.
// `./gradlew build` leaves them beside the jar in build/libs/reports/, so a release can be cut
// with the adjacency report (English and Portuguese) and the content coverage table attached.
tasks.register('conversationsReports', Copy) {
    description = 'Collects the conversation adjacency and coverage reports next to the jar.'
    group = 'documentation'
    dependsOn tasks.named('test')
    from layout.buildDirectory.dir('reports/conversations')
    into layout.buildDirectory.dir('libs/reports')
}

tasks.named('build').configure {
    dependsOn 'conversationsReports'
}

// Forward the build's stdin to the game's console. ModDevGradle's run tasks otherwise get an
// empty input stream, so a piped `reload` or `stop` is silently swallowed and the only way to end
// a headless server is to kill it. With this, CI can boot the server, issue /reload to re-parse
// every dialogue file through MCA's loader, and stop cleanly.
tasks.matching { it.name.startsWith('run') }.configureEach {
    if (it instanceof JavaExec) {
        it.standardInput = System.in
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

/**
 * Fails the build if the packaged jar is not exactly what we intend to ship.
 *
 * Two failure modes this exists for. First, a dependency getting bundled: MCA, NeoForge and the
 * sibling mods are all on the compile path, and a stray `implementation files(...)` or a shadow
 * plugin would quietly fold their classes in, producing a jar that overrides the real mod at
 * runtime. Second, metadata drift: a jar with the old mods.toml, or missing the mixin config,
 * loads as far as the main menu and then behaves as if half the mod were not installed.
 */
tasks.register('verifyJarContents') {
    dependsOn tasks.named('jar')
    def jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def expectedVersion = project.version.toString()
    inputs.file(jarFile)
    outputs.upToDateWhen { false }

    doLast {
        def problems = []
        def entries = [] as Set
        def classMajors = [] as Set
        String implementationVersion = null

        new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                entries << entry.name
                if (entry.name == 'META-INF/MANIFEST.MF') {
                    zip.getInputStream(entry).withCloseable { input ->
                        implementationVersion = new java.util.jar.Manifest(input)
                                .mainAttributes.getValue('Implementation-Version')
                    }
                } else if (entry.name.endsWith('.class')) {
                    zip.getInputStream(entry).withCloseable { input ->
                        def header = new byte[8]
                        if (input.read(header) == 8) {
                            classMajors << (((header[6] & 0xFF) << 8) | (header[7] & 0xFF))
                        }
                    }
                }
            }
        }

        // --- required metadata ---
        ['META-INF/neoforge.mods.toml', 'mcaconversations.mixins.json', 'pack.mcmeta'].each {
            if (!entries.contains(it)) {
                problems << "missing ${it}"
            }
        }
        if (entries.contains('META-INF/mods.toml')) {
            problems << 'META-INF/mods.toml is the Forge spelling and is ignored by NeoForge'
        }

        // --- content namespaces ---
        ['data/mcaconversations/dialogues/', 'data/mcaconversations/chat_intents/',
         'data/mcaconversations/conversation_catalog/', 'data/mcaconversations/interiority/',
         'assets/mcaconversations/lang/', 'assets/mca_dialogue/lang/'].each { prefix ->
            if (!entries.any { it.startsWith(prefix) }) {
                problems << "no entries under ${prefix}"
            }
        }
        def dialogues = entries.count { it.startsWith('data/mcaconversations/dialogues/') && it.endsWith('.json') }
        if (dialogues < 920) {
            problems << "only ${dialogues} dialogue files; 920 are expected (content must not shrink)"
        }
        // The rest of the generated data trees, each with the floor the committed resources carry.
        // A compiler run that silently dropped a directory shows up here and nowhere else.
        ['conversation_beats': 110, 'chat_intents': 26, 'profession_profiles': 7,
         'village_culture': 2, 'thread_templates': 1, 'identity_tokens': 1,
         'episode_templates': 1, 'conversation_scenes': 1,
         'commitment_templates': 1].each { dir, floor ->
            def prefix = "data/mcaconversations/${dir}/"
            def found = entries.count { it.startsWith(prefix) && it.endsWith('.json') }
            if (found < floor) {
                problems << "only ${found} file(s) under ${prefix}; ${floor} are expected (content must not shrink)"
            }
        }
        def langFiles = entries.count { it.startsWith('assets/') && it.endsWith('.json') }
        if (langFiles < 46) {
            problems << "only ${langFiles} lang files; 46 are expected across 23 namespaces"
        }

        // --- nothing shaded ---
        ['net/conczin/mca/', 'forge/net/mca/', 'net/minecraftforge/', 'net/neoforged/',
         'dev/architectury/', 'dev/otectus/mcaquests/', 'dev/otectus/mcareputation/',
         'org/spongepowered/'].each { prefix ->
            def leaked = entries.findAll { it.startsWith(prefix) && it.endsWith('.class') }
            if (!leaked.isEmpty()) {
                problems << "${leaked.size()} shaded class(es) under ${prefix}, e.g. ${leaked.first()}"
            }
        }
        def nested = entries.findAll { it.endsWith('.jar') }
        if (!nested.isEmpty()) {
            problems << "nested jar(s): ${nested.join(', ')}"
        }

        // --- build identity ---
        if (implementationVersion != expectedVersion) {
            problems << "Implementation-Version is '${implementationVersion}', expected '${expectedVersion}'"
        }
        // 65 == Java 21. A stray 61 would mean something compiled against the wrong release.
        def wrong = classMajors.findAll { it != 65 }
        if (!wrong.isEmpty()) {
            problems << "class-file major version(s) ${wrong} present; Java 21 is 65"
        }

        if (!problems.isEmpty()) {
            throw new GradleException("verifyJarContents failed:" + System.lineSeparator()
                    + "  - " + problems.join(System.lineSeparator() + "  - "))
        }
        logger.lifecycle("verifyJarContents: ${entries.size()} entries, ${dialogues} dialogues, " +
                "${langFiles} lang files, nothing shaded.")
    }
}

tasks.named('build').configure {
    dependsOn tasks.named('verifyJarContents')
}
