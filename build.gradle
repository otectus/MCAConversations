buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.18+ ships Java 17; target it explicitly (system default JDK is 21).
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Required for this template's processResources/run setup.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Remap dependency/our-own mixin refmaps SRG->official in dev. NOTE: this does NOT make
            // MCA load in dev — MCA's forge mixins ship with no refmap and hard-coded SRG names, so
            // they only resolve in a production (SRG) runtime. Real MCA behaviour is therefore
            // verified in a production-style instance, not under dev runClient/runServer.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Architectury API (hard runtime dependency of MCA Reborn's Forge build).
    maven { url = 'https://maven.architectury.dev/' }

    // MCA Reborn via Modrinth Maven. exclusiveContent keeps this repo scoped to the
    // maven.modrinth group and routes resolution through ForgeGradle's deobf pipeline.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
}

// Every MCA build McaBindingProbeTest verifies the manifest against, one configuration each. Two
// versions of the same module cannot share a configuration -- Gradle's conflict resolution would
// collapse them to the newer and the older package root would go untested, which is how MCA's rename
// reached players in the first place. Each is probed in its own class loader.
ext.mcaProbeVersions = (project.findProperty('mcaProbeVersions') ?: mca_probe_versions)
        .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }

configurations {
    // Keep MCA off the unit-test runtime. Gradle's testRuntimeOnly extends runtimeOnly, so the dev-run
    // MCA jar would otherwise land on testRuntimeClasspath -- and the unit suite is precisely where
    // "MCA is absent" has to be the real, exercised state. McaBindingProbeTest still reaches the real
    // MCA jars, by opening each in a throwaway class loader rather than by having them on the classpath.
    testRuntimeClasspath {
        exclude group: 'maven.modrinth', module: 'minecraft-comes-alive-reborn'
    }
}

mcaProbeVersions.eachWithIndex { version, i ->
    configurations.create("mcaProbe${i}") {
        canBeConsumed = false
        // Just the MCA jar: the probe opens it against the test classloader, which already carries
        // Minecraft, and pulling MCA's own dependency graph in would only slow the build.
        transitive = false
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // MCA Reborn — obfuscated production (Universal) jar, remapped to our dev mappings by fg.deobf.
    //
    // runtimeOnly, NOT implementation: no class in src/main/java names an MCA type any more, because
    // compat.mca.McaBinding resolves every MCA class and member by name at runtime and the mixins
    // declare their targets as strings. That is what lets one jar serve both MCA's forge.net.mca.*
    // layout and the renamed forge.net.conczin.mca.* one. A compile dependency would only invite the
    // static linkage back -- NoMcaStaticLinkTest fails the build if it ever returns. runtimeOnly also
    // keeps MCA off testRuntimeClasspath, so the unit suite exercises the genuine "MCA absent"
    // degradation path rather than a half-bound one.
    runtimeOnly fg.deobf("maven.modrinth:minecraft-comes-alive-reborn:${mca_version}")

    // The probe fleet McaBindingProbeTest replays the manifest against (see ext.mcaProbeVersions).
    // Deliberately NOT fg.deobf: only Minecraft's methods and fields carry SRG names in a production
    // jar, never its class names, so MCA's own declarations already read as e.g.
    // `getResidents(net.minecraft.server.level.ServerLevel)` -- exactly what the manifest's parameter
    // hints compare against. Skipping the deobf round-trip also keeps these configurations out of
    // ForgeGradle's remap pipeline, which cannot serve one resolved from a test task's doFirst.
    mcaProbeVersions.eachWithIndex { version, i ->
        add("mcaProbe${i}", "maven.modrinth:minecraft-comes-alive-reborn:${version}")
    }

    // Architectury API (Forge) — required at runtime by MCA. deobf for dev remapping.
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")

    // MCA: Quests — OPTIONAL integration, compile-only. The sibling mod isn't published to a Maven, so
    // we compile against its dev-mapped class output (both mods share `official` 1.20.1 mappings, so the
    // Minecraft type names match and reobfJar remaps our own references for production). Quests' own
    // class names are stable dev<->prod, and the real mod supplies them at runtime — hence compileOnly,
    // never bundled. Build MCA: Quests first (`../MCAQuests: ./gradlew compileJava`) so these exist; when
    // absent the compat.quests classes simply won't compile, which is why the integration is gated at
    // runtime by QuestsBridge (ModList "mcaquests") and this optional mods.toml dependency.
    def mcaQuestsClasses = file("${projectDir}/../MCAQuests/build/classes/java/main")
    if (mcaQuestsClasses.exists()) {
        compileOnly files(mcaQuestsClasses)
    } else {
        logger.warn("MCA: Quests classes not found at ${mcaQuestsClasses}; build it first to compile the optional Quests integration.")
    }

    // MCA: Reputation — OPTIONAL integration, compile-only, same sibling-class-output pattern as the
    // Quests block above. Build it first (`../MCAReputation: ./gradlew classes`); when absent the
    // compat.reputation package cannot compile, which is a loud failure rather than a silently
    // integration-less jar (spec 9.2). Never bundled: the real mod supplies these classes at runtime
    // and everything that touches them is gated behind ReputationBridge's ModList check.
    def mcaReputationClasses = file("${projectDir}/../MCAReputation/build/classes/java/main")
    if (mcaReputationClasses.exists()) {
        compileOnly files(mcaReputationClasses)
    } else {
        logger.warn("MCA: Reputation classes not found at ${mcaReputationClasses}; build it first " +
                "(../MCAReputation: ./gradlew classes) or the optional Reputation integration will not compile.")
    }

    // Mixin annotation processor — generates the refmap for our server-side gift-detection mixin.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Unit tests for the pure (non-MCA) gossip/template/state logic.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // The MCA jars travel as paths, not a classpath: McaBindingProbeTest opens each in its own
    // URLClassLoader, so the binding manifest is verified against real MCA without a single MCA class
    // being linked into the test JVM.
    //
    // Resolved in doFirst, not at configuration time: resolving a configuration while the build is
    // still being configured freezes ForgeGradle's deobf repository before every fg.deobf dependency
    // is registered ("cannot mutate content repository descriptor after repository has been used").
    doFirst {
        systemProperty 'mcaconversations.probe.jars', mcaProbeVersions.indices
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .findAll { it.name.contains('minecraft-comes-alive') }
                .join(File.pathSeparator)
    }
}

// Resolves TownsteadBinding's manifest against a real Townstead jar, in its own JVM and its own
// classloader. Separate from `test` because it needs a jar nobody can resolve from a maven: Townstead
// is published on CurseForge only, so the path is supplied by the person running it.
//
//     ./gradlew townsteadProbeTest -PtownsteadLegacyJar=/path/townstead-0.7.6+1.20.1.jar
//
// Both -PtownsteadModernJar and -PtownsteadLegacyJar are accepted and either may be given alone.
// MCA rides along on `mcaconversations.probe.jars` for a load-bearing reason: Townstead is compiled
// against MCA, so enumerating TownsteadAPI's methods resolves an MCA parameter type, and without MCA
// present the whole class reads as unbound and the probe would pass vacuously. Minecraft itself comes
// from sourceSets.test.runtimeClasspath for the same reason.
tasks.register('townsteadProbeTest', Test) {
    group = 'verification'
    description = 'Verifies the Townstead binding manifest against a supplied Townstead jar.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'dev.otectus.mcaconversations.compat.TownsteadBindingProbeTest'
        includeTestsMatching 'dev.otectus.mcaconversations.compat.TownsteadUiMixinProbeTest'
    }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    doFirst {
        systemProperty 'mcaconversations.townstead.probe.jars',
                ['townsteadModernJar', 'townsteadLegacyJar']
                        .findAll { project.hasProperty(it) }
                        .collect { project.property(it).toString() }
                        .join(File.pathSeparator)
        systemProperty 'mcaconversations.probe.jars', configurations.runtimeClasspath
                .findAll { it.name.contains('minecraft-comes-alive') }
                .join(File.pathSeparator)
    }
}

// The content compiler: expands src/content/ authoring sources into runtime resources (spec 19).
//
// Deliberately NOT wired into processResources. The compiler lives in the test source set - it is
// build tooling and has no business in the shipped jar - and compileTestJava already depends on
// processResources through `classes`, so making processResources depend on it would be a cycle.
//
// Instead the generated files are committed and ContentCompilerTest verifies them on every
// `./gradlew check`: it compiles src/content into a scratch copy of the output tree and byte-compares
// it back, failing on any file that is stale, missing or left over. That check never writes into the
// repository. Regenerating is this task, and it is an explicit author command:
//
//     ./gradlew generateConversationContent
//
// The check alone, for the edit-compile-look loop:
//
//     ./gradlew verifyGeneratedConversationContent
//
tasks.register('verifyGeneratedConversationContent', Test) {
    group = 'verification'
    description = 'Fails if the committed generated content is not what src/content compiles to.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaconversations.authoring.ContentCompilerTest' }
    // Content drift is a property of the working tree, not of the inputs Gradle can see: a hand edit
    // to a generated file changes neither this task's classpath nor its sources.
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

tasks.register('generateConversationContent', JavaExec) {
    group = 'documentation'
    description = 'Compiles src/content authoring sources into runtime data and lang resources.'
    dependsOn tasks.named('compileTestJava'), tasks.named('processTestResources')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.otectus.mcaconversations.authoring.ContentCompiler'
    args 'src/content', 'src/main/resources'
    outputs.upToDateWhen { false }
}

// The personality overlays are six voices, not twenty-one. Each voice is authored once in
// src/content/voices and expanded into every namespace that speaks it, in both locales, by
//
//     ./gradlew generateVoiceOverlays
//
// Before this existed the expansion was done by hand, which is why 999 of every family's 1,084 keys
// are byte-identical and why overlay coverage sat at 5.9%: adding one line cost forty-two edits.
//
tasks.register('verifyVoiceOverlays', Test) {
    group = 'verification'
    description = 'Fails if the committed personality overlays are not what src/content/voices compiles to.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'dev.otectus.mcaconversations.authoring.VoiceFamilyCompilerTest' }
    // Overlay drift is a property of the working tree, not of any input Gradle can see.
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

tasks.register('generateVoiceOverlays', JavaExec) {
    group = 'documentation'
    description = 'Expands the six authored voices into every personality overlay namespace.'
    dependsOn tasks.named('compileTestJava'), tasks.named('processTestResources')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.otectus.mcaconversations.authoring.VoiceFamilyCompiler'
    args 'src/content/voices', 'src/main/resources/assets'
    outputs.upToDateWhen { false }
}

// MixinGradle: generate the refmap for our mixin and register the config for reobfuscation.
mixin {
    add sourceSets.main, 'mcaconversations.refmap.json'
    config 'mcaconversations.mixins.json'
}

// Expand metadata placeholders into mods.toml / pack.mcmeta at build time.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

// Phase 9: the generated review and coverage reports are release artifacts, not build leftovers.
// `./gradlew build` leaves them beside the jar in build/libs/reports/, so a release can be cut
// with the adjacency report (English and Portuguese) and the content coverage table attached.
tasks.register('conversationsReports', Copy) {
    description = 'Collects the conversation adjacency and coverage reports next to the jar.'
    group = 'documentation'
    dependsOn tasks.named('test')
    from layout.buildDirectory.dir('reports/conversations')
    into layout.buildDirectory.dir('libs/reports')
}

tasks.named('build').configure {
    dependsOn 'conversationsReports'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
