plugins {
    id 'idea'
    id 'eclipse'
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.5+ requires Java 21. The foojay resolver provisions it if the system JDK is older.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // The content lint, locale parity and NBT round-trip tests need real Minecraft classes on
    // the test classpath.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    // MCA Reborn. The loader is in the artifact id (mca-neoforge), so there is no
    // Fabric/NeoForge ambiguity here. Scoped so nothing else resolves through it.
    maven {
        name = 'Conczin'
        url = 'https://maven.conczin.net/Artifacts'
        content { includeGroup 'net.conczin.mca' }
    }
}

dependencies {
    // MCA Reborn — a mojmap NeoForge mod jar, so it loads as a real mod under runClient/runServer.
    // (On 1.20.1 it could not: MCA's Forge mixins shipped SRG-named with no refmap.)
    //
    // transitive = false on purpose: MCA's POM declares runtime dependencies on
    // maven.modrinth:sodium and maven.modrinth:ferrite-core, which do not resolve without the
    // Modrinth Maven. MixinExtras is already jarJar'd inside the MCA jar, so nothing needed is lost.
    //
    // All MCA access is isolated behind dev.otectus.mcaconversations.compat and .mixin.
    implementation("net.conczin.mca:mca-neoforge:${mca_version}") {
        transitive = false
    }

    // MCA: Quests — OPTIONAL integration, compile-only. The sibling mod isn't published to a
    // Maven, so we compile against its dev class output; both mods use official 1.21.1 mappings,
    // so the Minecraft type names match and there is no reobfuscation step to worry about. Never
    // bundled: the real mod supplies these classes at runtime, gated by QuestsBridge's ModList
    // check and the optional neoforge.mods.toml dependency.
    def mcaQuestsClasses = file("${projectDir}/../MCAQuests_1.21.1/build/classes/java/main")
    if (mcaQuestsClasses.exists()) {
        compileOnly files(mcaQuestsClasses)
    } else {
        logger.warn("MCA: Quests (1.21.1) classes not found at ${mcaQuestsClasses}; " +
                "building without the optional Quests integration. Build it first " +
                "(../MCAQuests_1.21.1: ./gradlew classes) to include it.")
        // Only the files that actually import dev.otectus.mcaquests.*. QuestConditionQuery and
        // QuestOpenDirective are pure data types referenced by ConversationsMcaRegistrar, so they
        // must keep compiling either way.
        sourceSets.main.java.exclude(
                'dev/otectus/mcaconversations/compat/quests/ConversationsQuestsCompat.java',
                'dev/otectus/mcaconversations/compat/quests/ConversationsQuestsEvents.java',
                'dev/otectus/mcaconversations/compat/quests/QuestVoiceResolver.java',
                'dev/otectus/mcaconversations/compat/quests/TalkAboutObjective.java',
                'dev/otectus/mcaconversations/compat/quests/UnlockTopicReward.java')
    }

    // MCA: Reputation — OPTIONAL integration, same pattern. Reputation has not been ported to
    // 1.21.1 NeoForge yet, so this takes the exclude branch today; the sources stay in the tree
    // and compile again the moment the sibling port exists. Every reputation-gated dialogue
    // condition and template variable already falls back to a documented safe default.
    def mcaReputationClasses = file("${projectDir}/../MCAReputation_1.21.1/build/classes/java/main")
    if (mcaReputationClasses.exists()) {
        compileOnly files(mcaReputationClasses)
    } else {
        logger.warn("MCA: Reputation (1.21.1) classes not found at ${mcaReputationClasses}; " +
                "building without the optional Reputation integration.")
        sourceSets.main.java.exclude 'dev/otectus/mcaconversations/compat/reputation/**'
    }

    // No Mixin dependency or annotation processor: ModDevGradle wires both through NeoForge, and
    // 1.21.1 needs no refmap (dev and production both run official Mojang names).

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // ModDevGradle's unitTest runner works out of build/minecraft-junit, so the content lints,
    // locale parity and mixin-JSON tests cannot reach src/ through a bare relative path.
    systemProperty 'mcaconversations.projectRoot', project.projectDir.absolutePath
}

// Expand metadata placeholders into neoforge.mods.toml / pack.mcmeta at build time.
tasks.named('processResources', ProcessResources).configure {
    // Without this the expansion is written in the platform charset (windows-1252 here), which
    // cannot encode every character the metadata contains and emits '?' bytes mid-sequence. The
    // result is a neoforge.mods.toml that is not valid UTF-8, and NightConfig rejects the file.
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mca_version: mca_version, mca_version_range: mca_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
