name: build

# Every push and every pull request builds the mod the way a release does, runs the whole
# verification suite, and keeps the jar and the conversation reports as artifacts.
#
# The suite is the point. Most of what can go wrong in this project is content rather than code — an
# unreachable scene, a reply that answers nothing, a lang key present in one locale and not the other,
# a generated file that drifted from its authoring source — and all of that is checked by `check`
# rather than by compiling. Before 1.4.1 none of it ran anywhere but on a maintainer's machine.

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ForgeGradle 6 does not tolerate JDK 21; 17 is what gradle.properties pins the toolchain to.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Separate from the Gradle cache: the ForgeGradle userdev decompile is the expensive part of a
      # cold build, and it is keyed by the Forge version rather than by the lockfile.
      - name: Cache ForgeGradle output
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/forge_gradle
          key: forge-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: forge-${{ runner.os }}-

      - name: Check
        run: ./gradlew check --stacktrace

      - name: Build the reobfuscated jar
        run: ./gradlew build --stacktrace

      - name: Upload the jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcaconversations-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload the conversation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-reports
          path: |
            build/libs/reports/
            build/reports/conversations/
          if-no-files-found: warn

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
          if-no-files-found: ignore
